# 策略 #13 v2 — Martingale + Recenter + Stop Loss (单边做多 BTC)
# Revamp 2026-05-26: paired_inverse spot+perp hedge → single-side long martingale
#
# 跨 6 窗口验证最优 (MARTINGALE_RECENTER_VALIDATED_20260526.md):
#   - W7 训练: 夏普 +1.05 / 收益 +26.77% / 回撤 -16.88% / TP 39 / SL 5
#   - W1-W5 跨窗口: 4/5 正夏普, 5/5 胜 B&H
#   - W3 2022 全年大熊: 策略 -5.10% vs B&H -64.5% (省 59 个点)
#
# v1 yaml (paired_inverse) 备份: config/strategies/dgr_btc_main.yaml.bak_v1_NOGO_20260526

instance_name: "Martingale + 再定心"
strategy_type: dgr_btc

# ============================================================
# 启停 — 部署后默认 disabled, KILL switch ON, 用户显式开启
# ============================================================
enabled: false  # P10 部署后 user 手动 PATCH 改 true
live_mode: false  # paper 14 天通过后才考虑 LIVE

# ============================================================
# 交易标的 (binance spot)
# ============================================================
symbol:
  spot: "BTC/USDT"
  perp: "BTC/USDT:USDT"  # 保留字段供 v1 caller 兼容，不再使用
  base: "BTC"
  quote: "USDT"
  exchange: "binance"

# ============================================================
# 资金 — Paper 起步 $10k
# ============================================================
capital:
  total_usdt: 100000   # 2026-05-27 加大资金 10× (paper, B-config 不变)
  # v1 paired-hedge 字段保留向后兼容 (单边版本忽略)
  spot_initial_btc: 0
  short_initial_btc: 0
  reserve_ratio: 0

# ============================================================
# Martingale 内核 (新)
# ============================================================
martingale:
  # 2026-05-27 rebaseline 为 B-config (参见 CROSS_WINDOW_REPORT_B_CONFIG)
  # 跨 6 窗口 stress 验证：W7 +29.38% / W3 2022 大熊 -19.77% (alpha +44pp)
  grid_step: 0.04         # 每跌 4% 加一档
  factor: 1.5             # 每档加仓 ×1.5
  max_layers: 5           # 最多 5 档 (满层后 SL 兜底)
  tp_pct: 0.04            # 平均成本 +4% 止盈清仓
  sl_pct: 0.10            # 平均成本 -10% 强制止损
  layer_weights:          # factor-derived (canonical, NOT rounded)
    - 0.07583            # 1.5^0 / 13.1875
    - 0.11374            # 1.5^1 / 13.1875
    - 0.17062            # 1.5^2 / 13.1875
    - 0.25592            # 1.5^3 / 13.1875
    - 0.38389            # 1.5^4 / 13.1875

# ============================================================
# 执行
# ============================================================
execution:
  fee_pct: 0.0006         # 0.04% taker + 0.02% slippage
  order_type: "MARKET"    # paper 用市价模拟，LIVE 阶段决定 maker 优化
  tick_interval_seconds: 5

# ============================================================
# 风控 — 5 层 KILL (mirror v1 dgr_btc live_safety)
# ============================================================
risk:
  daily_loss_cap_pct: 0.05      # 单日 -5% 触发 KILL
  max_forced_holds_hours: 24    # 满层卡死 > 24h 触发 KILL (防 LUNA 锁死)
  max_drawdown_pct: 0.30        # 总回撤 > 30% 触发 KILL
  alert_on_sl: true
  alert_on_kill: true
  alert_on_max_layer: true      # 触达第 5 层时告警

# ============================================================
# Live Safety (Phase E 后才用)
# ============================================================
live_safety:
  enabled: false
  dry_run: false
  telegram_alerts_enabled: true
  max_order_usd: 100
  max_daily_order_count: 100
  max_daily_notional_usd: 5000
  max_price_deviation_pct: 0.5
  kill_switch_path: "/app/state/dgr_btc_KILL"
  audit_log_path: "/app/state/dgr_btc_audit.jsonl"
  require_kill_to_start: true  # 部署后 KILL 必须存在才不交易

# ============================================================
# State 持久化
# ============================================================
state:
  paper_state_file: "/app/state/dgr_btc_paper_state.json"
  live_state_file: "/app/state/dgr_btc_state.json"
  trades_jsonl_path: "/app/state/dgr_btc_trades.jsonl"

# ============================================================
# 回测 (P5 backtest_runner 直读)
# ============================================================
backtest:
  fee_pct: 0.0006
  klines_dir: "/Users/YANG/Desktop/Dracula/backtest_windows"
  default_window: "W7_full_cycle_25_26_1h.csv"

# ============================================================
# v1 兼容字段 (保留让 v1 caller 不崩，但单边版本不使用)
# P10 部署后 host 上 v1 yaml 文件可保留作历史，新策略不依赖这些
# ============================================================
grid:
  center_price: 0
  step_usdt: 250
  qty_per_grid: 0.002
  dynamic_bounds:
    enabled: false
    width_pct: 0.15
    recenter_enabled: false
    recenter_trigger_pct: 0.12
    recenter_cooldown_sec: 600

delta:
  target: 0.0
  upper_limit: 0
  lower_limit: 0
  rebalance_threshold: 0

position_limits:
  max_spot_btc: 0.5
  max_short_btc: 0
  leverage: 1
