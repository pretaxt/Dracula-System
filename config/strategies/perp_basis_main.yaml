# 策略 #02 — 跨所基差套利 (perp-basis)
# 跨所同标的 funding rate 差 → 高 funding 端 SHORT + 低 funding 端 LONG
#
# 阶段路线:
#   A: scanner + UI 监控
#   B: 回测引擎接入
#   C (当前): paper_trading 跨所双 broker delta-neutral
#   D: 实盘小额验证

instance_name: perp_basis_main
strategy_type: perp_basis
enabled: true

scanning:
  scan_interval_seconds: 30        # 比 #01/#04 快（funding 数据已在 hub 缓存）
  max_funding_age_seconds: 180     # hub funding 老于此值则跳过

entry:
  # P0-5 入场门槛重新校准：3% 净空间仅 1.25% 易被滑点吃掉、50% override 过严导致 idle
  # break-even 数学：4 legs × 0.04% taker = 0.16% fee；持 6 个 funding period 时 break-even
  # 需 diff_apr ≥ 6×1095×0.0016/6 ≈ 12%，留 30% 缓冲 → 推荐 12% 下限
  min_diff_apr_pct: 12.0
  max_opportunities: 50

exit:
  exit_diff_apr_pct: 1.0           # 收敛平仓
  max_hold_hours: 240              # 10 天兜底
  min_hold_hours: 4                # 最少持仓覆盖至少一个 funding 结算（防小波动早退）
  margin_warn_pct: 80              # 任一侧 margin 占用 ≥ 80% 触发 stop

position:
  max_concurrent: 2                # 实盘起步：先 2 笔同时持仓，观察 1-2 周后再放
  notional_per_position: 50        # USD 起步，与 #04 一致
  exchanges: ["binance", "okx", "htx"]   # 仅含 trading key 已配置交易所 (3 家 → 3 pairs)
  candidate_symbols:               # 30 主流（与 #04 同源，避免长尾流动性）
    - BTC
    - ETH
    - SOL
    - BNB
    - XRP
    - DOGE
    - TRX
    - ADA
    - AVAX
    - LINK
    - DOT
    - NEAR
    - BCH
    - LTC
    - UNI
    - APT
    - ARB
    - OP
    - SUI
    - ATOM
    - FIL
    - ETC
    - AAVE
    - INJ
    - ICP
    - XLM
    - RUNE
    - SEI
    - LDO
    - TIA

# 风险控制（#02 独有 5 项）
risk:
  stop_price_divergence_pct: 5.0      # |long_price - short_price| / mid > 5% 强平（防交易所故障/数据脏点）
  max_abs_apr_pct: 500.0              # 单腿 |APR| 异常上限（>500% 通常是数据脏点或退市币）
  health_safe_diff_apr_max: 200.0     # diff_apr ≤ 200% → safe tier
  health_risky_diff_apr_max: 500.0    # 200% < diff_apr ≤ 500% → risky tier；>500% → dirty tier

# Live Trading（Phase D）
# 切换为实盘：仅有 trading key 的交易所参与；preflight 读 reconciler 真实余额；
# 任一 leg 余额不足或同步失败 → fail-closed 拒开。
paper_trading:
  enabled: true                       # 实盘启用：OKX hedge posSide 小写 + 跨钱包自动划转完整实现
  live_mode: true                     # 实盘 LiveBroker（非 PaperBroker wrapper）
  scan_interval_seconds: 60           # session tick 节奏（独立于 scanner）
