# 策略 #02 — 跨所基差套利 (perp-basis)
# 跨所同标的 funding rate 差 → 高 funding 端 SHORT + 低 funding 端 LONG
#
# 阶段路线:
#   A: scanner + UI 监控
#   B: 回测引擎接入
#   C (当前): paper_trading 跨所双 broker delta-neutral
#   D: 实盘小额验证
#
# 策略定性（2026-05-12 screener 验证后）：
#   本质是"HTX 结构性溢价收割"——HTX 零售散户在特定 alt 持续做多
#   导致 funding rate 系统性偏高，跨所 delta-neutral 套利收 funding 差。
#   candidate_symbols 由 /scanner/htx-premium 每周更新（days=14, force_refresh=true）。

instance_name: perp_basis_main
strategy_type: perp_basis
enabled: true

scanning:
  scan_interval_seconds: 30        # 比 #01/#04 快（funding 数据已在 hub 缓存）
  max_funding_age_seconds: 180     # hub funding 老于此值则跳过

entry:
  # 优化 v4（2026-05-12）— HTX 结构溢价策略，候选精简后降低入场门槛：
  # break-even 数学：4 legs × 0.055% avg taker = 0.22% fee round-trip
  # at diff=50%: break-even = 1927.2/50 = 38.5h ≈ 4.8 periods，结构溢价可轻松覆盖
  # 入场额外检查：两所实时价格偏差 < 0.7%（代码层实现）
  min_diff_apr_pct: 50.0
  max_opportunities: 20

exit:
  exit_diff_apr_pct: 2.0           # 绝对下限（字面值，与回测引擎一致；adaptive formula 已移除）
  max_hold_hours: 336              # 14 天兜底（结构溢价可持续更长）
  min_hold_hours: 48               # 最少持仓 48h（6 个 8h funding period，确保结构溢价充分积累）
  margin_warn_pct: 80              # ⚠️ TODO: 未实现 — session_factory 未传入此参数，当前无效
  # 连续衰减快速退出（代码层实现）：
  # diff_apr 连续 N 个 tick 下降 且 当前 < entry × 40% → 提前平仓
  # at entry=50%: 触发线 = 50% × 40% = 20% APR
  consecutive_decline_exit_ticks: 3    # 连续衰减 3 tick (3min)
  consecutive_decline_pct: 0.40        # 跌至入场时的 40% 触发

position:
  max_concurrent: 3
  notional_per_position: 200       # USD；4 腿 fee = $0.44；at 50% APR break-even 38.5h
  exchanges: [binance, okx, htx, bybit]
  #
  # candidate_symbols — 仅含 HTX 结构性溢价验证币种
  # 筛选标准（/scanner/htx-premium，2026-05-12 14天数据）：
  #   Tier 1 ★STRONG : persistence ≥ 80%, score ≥ 40（高置信度结构溢价）
  #   Tier 2  MODERATE: persistence ≥ 60%, score ≥ 20（有持续性，值得监控）
  #   Tier 3  历史胜率: 回测 TOP 结果，历史已验证但 screener 数据不足
  #
  # 维护节奏：每 7 天运行 GET /scanner/htx-premium?days=14&force_refresh=true
  #   STRONG + last_diff > 20% → 保留 / 新增
  #   STRONG but last_diff ≈ 0  → 标记观察（溢价可能结束）
  #   跌出 STRONG               → 移除
  candidate_symbols:
    # ── Tier 1: Screener STRONG（14天验证，结构性高置信度）────────────────
    - COMP        # persistence 100%, avg 53.77% APR diff, break-even 35.8h
    - ENJ         # persistence 96.4%, avg 48.19% APR diff, break-even 40.0h（游戏 NFT）
    - APE         # persistence 95.2%, avg 44.54% APR diff, break-even 43.3h（ApeCoin）
    # ── Tier 2: Screener MODERATE + 历史回测双验证 ──────────────────────
    - WLD         # persistence 85.7%, avg 29.72% APR diff；回测 90d 高频机会
    - TIA         # 回测 100% 胜率；HTX↑ Binance/OKX↓，celestia 叙事散户偏爱
    - AAVE        # 回测 100% 胜率，5笔稳定；HTX DeFi 蓝筹溢价
    - INJ         # 回测 71% 胜率，7笔；HTX↑ OKX↓
    # ── Tier 3: HTX 零售结构偏好（Gaming / Metaverse）────────────────────
    - SAND        # Sandbox，HTX 中文游戏叙事，结构性长偏
    - MANA        # Decentraland，同上
    - AXS         # Axie Infinity，HTX↑ 历史频繁
    - CFX         # Conflux，HTX "主场"代币，国内散户持仓集中
    # ── Tier 3: 脉冲高 diff（保留少量捕捉 spike）────────────────────────
    - ORDI        # BTC Ordinals，funding 脉冲极强，HTX 华人社区热点
    - KAVA        # DeFi，Binance/OKX/Bybit/HTX，HTX 偶发溢价

# 风险控制（#02 独有）
risk:
  stop_price_divergence_pct: 1.2
  max_entry_price_divergence_pct: 0.7
  max_abs_apr_pct: 500.0
  health_safe_diff_apr_max: 200.0
  health_risky_diff_apr_max: 500.0

# Live Trading（Phase D）
paper_trading:
  enabled: true
  live_mode: true
  scan_interval_seconds: 60           # session tick 节奏（独立于 scanner）
