[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dracula-system"
version = "0.1.0"
description = "Multi-strategy crypto arbitrage trading system"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Cache / message bus
    "redis[hiredis]>=5.0.4",

    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.1",

    # Logging
    "structlog>=24.1.0",

    # Resilience
    "tenacity>=8.3.0",

    # Exchange connectivity
    "ccxt>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",       # FastAPI TestClient (async)
    "factory-boy>=3.3.0",  # test fixtures
    "freezegun>=1.5.0",    # time mocking
    "respx>=0.21.0",       # mock httpx calls
    "ruff>=0.4.0",         # linter + formatter
    "mypy>=1.10.0",        # type checker
    "types-PyYAML>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
omit = [
    # CCXT adapter methods require live exchange connections;
    # covered by Week 4 testnet integration tests instead.
    "app/exchanges/cex/ccxt_base.py",
    "app/exchanges/cex/binance.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
